# Manifesto do corpus — Fase 0
#
# Regra de entrada: uma página só entra se puder ser mapeada a pelo menos um
# controle do catálogo. Com um conjunto de consultas fixo, cada página
# irrelevante é apenas mais um distrator competindo com a resposta certa.
#
# Todas as URLs foram verificadas (HTTP 200) e todas as licenças foram
# conferidas no arquivo LICENSE do repositório de origem.
#
# `controles` vem da medição em corpus/cobertura.md, não de palpite. Ainda
# assim é candidato: a Fase 2 refina para o nível de seção.

versao: 1
idioma: en

licencas:
  Apache-2.0:
    fonte: https://github.com/docker/docs/blob/main/LICENSE
    citacao_permitida: true
    exige_atribuicao: true
  CC-BY-4.0:
    fonte: https://github.com/kubernetes/website/blob/main/LICENSE
    citacao_permitida: true
    exige_atribuicao: true
  US-Gov-Public-Domain:
    observacao: Obra do governo dos EUA, sem restrição de uso
    citacao_permitida: true
    exige_atribuicao: false
  CC-BY-NC-SA-4.0:
    fonte: https://creativecommons.org/licenses/by-nc-sa/4.0/
    citacao_permitida: true
    exige_atribuicao: true
    # Uso NÃO COMERCIAL apenas. Este projeto é didático e de portfólio, o que
    # a licença cobre. Se a finalidade mudar, a fonte sai do corpus e os
    # controles que dependem dela voltam a `cobertura.SEM_RESPALDO_OFICIAL`.
    somente_nao_comercial: true
    atribuicao: >-
      Center for Internet Security, CIS Docker Benchmark v1.8.0, sob
      CC BY-NC-SA 4.0. O documento não é redistribuído: o PDF fica fora do
      repositório e apenas o texto extraído é indexado.

# Fontes deliberadamente NÃO ingeridas, e por quê.
excluidas:
  cis_benchmarks:
    motivo: >-
      Redistribuição restrita. Decisão do projeto: usar apenas o NÚMERO DA
      CLÁUSULA como referência cruzada (campo framework_refs do catálogo),
      nunca o texto. Nada do CIS entra no corpus.
  linux_man_pages:
    motivo: >-
      Licenciamento heterogêneo por página. O conteúdo necessário (capabilities,
      seccomp, AppArmor) está coberto pelas páginas de camada 3 do Docker e do
      Kubernetes, com licença limpa.
  owasp_cheat_sheets:
    motivo: >-
      CC BY-SA 4.0. A cláusula ShareAlike exige atenção se o texto for adaptado.
      Adiado até haver necessidade — a cobertura atual não depende dele.

# camada 1 = normativo (qual é a configuração correta)
# camada 2 = fundamentação do risco (por que é perigoso)
# camada 3 = mecanismo do sistema operacional (por que essa capability é perigosa)
