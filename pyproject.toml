[project]
name = "conformidade"
version = "0.1.0"
description = "Sistema multi-agente de conformidade para Docker e Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "numpy>=1.26",
    "openai>=1.54.0",
    "azure-identity>=1.19.0",
]

[project.optional-dependencies]
# Só o job de ingestão/indexação precisa do modelo. A API usa os vetores de
# consulta pré-computados e nunca carrega o fastembed.
embed = [
    "fastembed>=0.8.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[project.scripts]
conformidade-api = "conformidade.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformidade"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
